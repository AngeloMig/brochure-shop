<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Athena Brightening &amp; Refreshing Body Wash">
<title>Athena Brightening &amp; Refreshing Body Wash</title>
  <defs>
